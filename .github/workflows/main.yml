# Simpan sebagai .github/workflows/build-apk.yml di repo GitHub Anda.
# Taruh timbangan_hp.html di folder src_hp/ (JANGAN pakai nama folder "android").
# Jalankan: tab Actions -> build-apk -> Run workflow. Hasil: artifact "TimbanganIoT-apk".
name: build-apk
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Siapkan proyek Capacitor
        run: |
          npm init -y
          npm i @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6
          mkdir -p www
          cp src_hp/timbangan_hp.html www/index.html
          curl -L -o www/mqtt.min.js https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js
          sed -i 's#https://cdn.jsdelivr.net/npm/mqtt@5.10.1/dist/mqtt.min.js#mqtt.min.js#' www/index.html
          echo '{"appId":"com.timbangan.iot","appName":"Timbangan IoT","webDir":"www","server":{"androidScheme":"http","cleartext":true}}' > capacitor.config.json
          npx cap add android
          npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: TimbanganIoT-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
